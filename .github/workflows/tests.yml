name: Framework Tests & Hygiene

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests, py_compile, and UTF-8 BOM checks
        run: python -m unittest -v tests/test_framework.py

      - name: Verify CLI --help contracts
        run: |
          python scripts/download_course.py --help
          python scripts/verify_course.py --help
          python scripts/convert_to_mp4.py --help
          python scripts/split_materials.py --help
          python scripts/zip_folders.py --help
          python scripts/sanitize_capture.py --help

      - name: Check Bash orchestrator syntax
        if: runner.os == 'Linux'
        run: bash -n scrape-course.sh
